<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>A-side bar</title>
</head>
<body>
    
    <aside>
        <div class="aside-header">
            <button class="button-icons"><img src="icons/burger.svg"></button>
            <button class="button-icons"><img src="icons/Group.svg"></button>
            <button class="button-icons"><img src="icons/search.svg"></button>
        </div>
        
        <div class="aside-buttons">
            <button class="a-button tecnic">
                <img src="icons/highlight.svg">Ремонт техники
            </button>
            <button class="a-button">Услуги и сервисы</button>
            <button class="a-button">Корпоративным клиентам</button>
            <button class="a-button">Продавцам техники</button>
            <button class="a-button">Партнерам</button>
            <button class="a-button">Производителям</button>
            <button class="a-button">Наши сервисные центры</button>
            <button class="a-button">Контакты</button>
        </div>

        <div class="aside-contact__icons">
            <button class="contact-icons"><img src="icons/chat copy.svg"></button>
            <button class="contact-icons"><img src="icons/chat.svg"></button>
            <button class="contact-icons"><img src="icons/profile.svg"></button>
        </div>

        <div class="aside-contact__info"> 
            <p class="mail">mail@cps.com</p>
            <p class="number">8 800 890 8900</p>
        </div>    
        
        <div class="aside-lang">
            <button class="lang">RU</button>
            <button class="lang">EN</button>
            <button class="lang">CH</button>
        </div>
    </aside>
    
</body>
</html>
